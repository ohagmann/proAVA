[workspace]
resolver = "2"
members = [
    "apps/proava",
    "apps/proava-mcp",
    "crates/proava-domain",
    "crates/proava-application",
    "crates/proava-infrastructure",
    "crates/proava-ui",
    "crates/proava-gaeb",
    "crates/proava-print",
    "crates/proava-exchange",
    "crates/proava-spell",
    "crates/proava-web-protocol",
    "crates/proava-bridge-protocol",
]
# Hilfsprogramm mit Browser-Engine (wry): eigener Workspace, damit wry/WebKitGTK/WebView2
# nie in den Abhängigkeitsbaum von proava und proava-mcp geraten.
exclude = ["apps/proava-web"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "BUSL-1.1"
authors = ["Oliver Hagmann"]

[workspace.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "clipboard"] }
egui = "0.37"
egui_kittest = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
quick-xml = "0.42"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
proptest = { version = "1.11", default-features = false, features = ["std"] }
# Nur für Tests: ein eigener, eindeutiger Temp-Ordner je Test (exklusiv angelegt, nur er wird gelöscht).
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Clipboard with HTML (formatted copy/paste); same version egui-winit uses.
arboard = { version = "3.7", default-features = false }

[profile.dev]
opt-level = 1
# Nur Zeilennummern (für Backtraces): volle Debug-Infos ließen die target-Ordner der
# target-Ordner auf je 70–150 GB wachsen.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
