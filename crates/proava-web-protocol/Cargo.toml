[package]
name = "proava-web-protocol"
# Ausgeschrieben statt `workspace = true`: das Hilfsprogramm `apps/proava-web`
# (eigener Workspace) bindet dieses Crate über einen Pfad ein.
version = "0.2.0"
edition = "2021"
license = "BUSL-1.1"
authors = ["Oliver Hagmann"]
description = "Absprache zwischen proAVA und dem Hilfsprogramm proava-web (eingebautes Browserfenster)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
